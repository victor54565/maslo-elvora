<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ панель — Каталог ELVORA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { margin-bottom: 30px; color: #D4B36A; }
    table { width: 100%; border-collapse: collapse; background: #111; border: 1px solid #333; margin-bottom: 30px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; }
    th { background: #1a1a1a; font-weight: 600; color: #D4B36A; }
    tr:hover { background: #151515; }
    input { width: 70px; padding: 6px 8px; background: #222; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 13px; }
    input:focus { outline: none; border-color: #D4B36A; background: #1a1a1a; }
    button { padding: 10px 20px; background: #D4B36A; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    button:hover { background: #E8C878; }
    .save-btn { background: #4CAF50; color: white; }
    .save-btn:hover { background: #45a049; }
    .status { padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; }
    .status.success { background: #1B5E20; color: #4CAF50; }
    .status.error { background: #5E1B1B; color: #FF6B6B; }
    .group-header { background: #1a1a1a; font-weight: 700; color: #D4B36A; }
    .info { color: #888; font-size: 12px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 Администратор каталога ELVORA</h1>

    <div id="status" class="status" style="display: none;"></div>

    <p class="info">Редактируйте цены и остатки товаров. Остатки указываются штуками для каждого объёма.</p>

    <table id="catalog-table">
      <thead>
        <tr>
          <th>Название</th>
          <th colspan="3">Цена (₸)</th>
          <th colspan="3">Остаток (шт)</th>
          <th>Действие</th>
        </tr>
        <tr>
          <th></th>
          <th>100мл</th>
          <th>250мл</th>
          <th>500мл</th>
          <th>100мл</th>
          <th>250мл</th>
          <th>500мл</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <button class="save-btn" onclick="saveAll()">💾 Сохранить все</button>
  </div>

  <script>
    let catalog = [];
    let originalCatalog = [];

    async function loadCatalog() {
      try {
        const res = await fetch('data/catalog.json');
        catalog = (await res.json()).products || [];
        originalCatalog = JSON.parse(JSON.stringify(catalog));
        renderTable();
      } catch (e) {
        showStatus('Ошибка загрузки каталога: ' + e.message, 'error');
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      let currentGroup = '';
      catalog.forEach((item, idx) => {
        if (item.group !== currentGroup) {
          currentGroup = item.group;
          const tr = document.createElement('tr');
          tr.className = 'group-header';
          tr.innerHTML = `<td colspan="8">${currentGroup}</td>`;
          tbody.appendChild(tr);
        }

        const tr = document.createElement('tr');
        const stock = (item.stock && typeof item.stock === 'object') ? item.stock : { '100': 0, '250': 0, '500': 0 };

        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td><input type="number" id="p100-${idx}" value="${item.price100 || 0}" /></td>
          <td><input type="number" id="p250-${idx}" value="${item.price250 || 0}" /></td>
          <td><input type="number" id="p500-${idx}" value="${item.price500 || 0}" /></td>
          <td><input type="number" id="s100-${idx}" value="${stock['100'] || 0}" /></td>
          <td><input type="number" id="s250-${idx}" value="${stock['250'] || 0}" /></td>
          <td><input type="number" id="s500-${idx}" value="${stock['500'] || 0}" /></td>
          <td><button type="button" onclick="reset(${idx})">↻</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function reset(idx) {
      catalog[idx] = JSON.parse(JSON.stringify(originalCatalog[idx]));
      renderTable();
    }

    async function saveAll() {
      // Собираем все изменения
      const updated = [];
      catalog.forEach((item, idx) => {
        const p100 = parseInt(document.getElementById('p100-' + idx).value, 10) || 0;
        const p250 = parseInt(document.getElementById('p250-' + idx).value, 10) || 0;
        const p500 = parseInt(document.getElementById('p500-' + idx).value, 10) || 0;
        const s100 = parseInt(document.getElementById('s100-' + idx).value, 10) || 0;
        const s250 = parseInt(document.getElementById('s250-' + idx).value, 10) || 0;
        const s500 = parseInt(document.getElementById('s500-' + idx).value, 10) || 0;

        item.price100 = p100;
        item.price250 = p250;
        item.price500 = p500;
        if (!item.stock) item.stock = {};
        item.stock['100'] = s100;
        item.stock['250'] = s250;
        item.stock['500'] = s500;

        updated.push(item);
      });

      try {
        const res = await fetch('api/catalog.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ products: updated })
        });

        const result = await res.json();
        if (result.ok) {
          originalCatalog = JSON.parse(JSON.stringify(catalog));
          showStatus('✓ Все изменения сохранены! (' + updated.length + ' товаров)', 'success');
        } else {
          showStatus('Ошибка сервера: ' + (result.error || 'неизвестная ошибка'), 'error');
        }
      } catch (e) {
        showStatus('Ошибка при сохранении: ' + e.message, 'error');
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.className = 'status ' + type;
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 6000);
    }

    loadCatalog();
  </script>
</body>
</html>
